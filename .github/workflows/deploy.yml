name: Deploy to Vercel

# Vercel's own GitHub integration blocks deploys from commits authored by
# anyone who isn't a collaborator on the connected Vercel account (Hobby
# plan has no concept of team members at all). Deploy Hooks don't check
# authorship — they just build whatever is currently on the branch — so
# this workflow (which runs under the repo's own permissions, regardless
# of who pushed) triggers them directly instead.
on:
  push:
    branches: [main, dev]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel frontend deploy hook
        env:
          HOOK_URL: ${{ github.ref_name == 'main' && secrets.VERCEL_DEPLOY_HOOK_FRONTEND_PROD || secrets.VERCEL_DEPLOY_HOOK_FRONTEND_DEV }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret is empty or missing for branch '${{ github.ref_name }}'. Check that the repo secret name exactly matches VERCEL_DEPLOY_HOOK_FRONTEND_$( [ '${{ github.ref_name }}' = 'main' ] && echo PROD || echo DEV )."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel backend deploy hook
        env:
          HOOK_URL: ${{ github.ref_name == 'main' && secrets.VERCEL_DEPLOY_HOOK_BACKEND_PROD || secrets.VERCEL_DEPLOY_HOOK_BACKEND_DEV }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret is empty or missing for branch '${{ github.ref_name }}'. Check that the repo secret name exactly matches VERCEL_DEPLOY_HOOK_BACKEND_$( [ '${{ github.ref_name }}' = 'main' ] && echo PROD || echo DEV )."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
